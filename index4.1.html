<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h2>Student Registration Form</h2>

    <form action="#" method="POST">
        <!-- Full Name -->
        <div>
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required>
        </div>
        <br>

        <!-- Email -->
        <div>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <br>

        <!-- Password -->
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <br>

        <!-- Phone Number -->
        <div>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>
        </div>
        <br>

        <!-- Age -->
        <div>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="1" max="120" required>
        </div>
        <br>

        <!-- Submit Button -->
        <div>
            <button type="submit">Register</button>
        </div>
    </form>

</body>
</html>
Highlights of this setup:
Form Structure: Wrapped inside a <form> tag.

Labels: Each input has an associated <label> using matching for and id attributes.

Input Types: Correct types (text, email, password, tel, and number) are used.

Attributes: Each input includes unique id, name, and required attributes for validation.
